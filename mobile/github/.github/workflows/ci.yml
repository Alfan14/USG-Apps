name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      # Uncomment setelah Jest dikonfigurasi
      # - name: Run unit tests
      #   run: npm test -- --passWithNoTests

      # Uncomment jika sudah ada ESLint
      # - name: Run linter
      #   run: npm run lint
